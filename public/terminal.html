<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Терминал — InvestHouse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="/" class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#b5f23d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M6 20v-6m6 6V9m6 11v-8"/></svg></span>
      <span class="hide-sm">InvestHouse</span>
    </a>
    <div class="stats">
      <div><span>Баланс</span><b id="s-balance">—</b></div>
      <div><span>Эквити</span><b id="s-equity">—</b></div>
      <div class="hide-sm"><span>Маржа</span><b id="s-margin">—</b></div>
      <div class="hide-sm"><span>Свободно</span><b id="s-free">—</b></div>
      <div class="hide-sm"><span>Уровень маржи</span><b id="s-level">—</b></div>
      <div><span>P/L</span><b id="s-pl">—</b></div>
    </div>
    <div class="topbar-actions">
      <span class="demo-badge">DEMO</span>
      <button class="tbtn" id="reset">Сбросить</button>
    </div>
  </header>

  <main class="chart-area">
    <div class="chart-head">
      <div class="symbol-title">
        <b id="c-symbol">—</b>
        <span id="c-ohlc" class="ohlc"></span>
      </div>
      <div class="tf" id="tf">
        <button data-tf="1" class="active">1m</button>
        <button data-tf="5">5m</button>
        <button data-tf="15">15m</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </main>

  <aside class="side">
    <div class="side-head">
      <h3>Рынок</h3>
      <select id="group">
        <option value="all">Все</option>
        <option value="crypto">Криптовалюты</option>
        <option value="forex">Валюты</option>
        <option value="metals">Металлы</option>
      </select>
    </div>
    <input id="search" class="search" placeholder="Поиск актива">
    <div class="watch-head"><span>Актив</span><span>Bid</span><span>Ask</span></div>
    <div class="watch" id="watch"></div>

    <div class="order">
      <div class="order-row">
        <label>Сумма, USD<input type="number" id="o-amount" value="100" min="1"></label>
        <label>Плечо
          <select id="o-lev"><option>1</option><option>5</option><option selected>10</option><option>20</option><option>50</option><option>100</option></select>
        </label>
      </div>
      <div class="order-info"><span>Объём позиции</span><b id="o-size">—</b></div>
      <div class="order-btns">
        <button class="sell" id="o-sell"><span>SELL</span><b id="o-bid">—</b></button>
        <button class="buy" id="o-buy"><span>BUY</span><b id="o-ask">—</b></button>
      </div>
    </div>
  </aside>

  <section class="bottom">
    <div class="btabs" id="btabs">
      <button data-tab="open" class="active">Открытые позиции <span id="open-count">0</span></button>
      <button data-tab="history">История</button>
    </div>
    <div class="ptable-wrap">
      <table class="ptable">
        <thead id="p-head"></thead>
        <tbody id="p-body"></tbody>
      </table>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="/js/common.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/terminal.js"></script>
</body>
</html>
