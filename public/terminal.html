<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Биржа — InvestHouse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://api.binance.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/terminal.css">
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body data-page="terminal">
<div class="xo">

  <!-- ========== TOP BAR ========== -->
  <header class="xhead">
    <a href="/" class="xlogo">
      <span class="xlogo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffd400" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M6 20v-6m6 6V9m6 11v-8"/></svg>
      </span>
      <span class="xlogo-text hide-md">InvestHouse</span>
    </a>

    <div class="xpair">
      <button class="xpair-btn" id="xpair-btn" aria-expanded="false">
        <span class="xpair-dot" id="xpair-dot"></span>
        <b><span id="x-sym-base">BTC</span><span class="xpair-quote">/USDT</span></b>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="xpair-dd" id="xpair-dd" hidden>
        <input type="search" class="xpair-search" id="xpair-search" placeholder="Поиск пары" autocomplete="off">
        <div class="xpair-list" id="xpair-list"></div>
      </div>
    </div>

    <div class="xstat" id="x-stat">
      <div class="xstat-cell"><span>Цена</span><b id="x-price" class="num">—</b></div>
      <div class="xstat-cell"><span>24ч изм.</span><b id="x-chg" class="num">—</b></div>
      <div class="xstat-cell hide-md"><span>24ч max</span><b id="x-hi" class="num">—</b></div>
      <div class="xstat-cell hide-md"><span>24ч min</span><b id="x-lo" class="num">—</b></div>
      <div class="xstat-cell hide-lg"><span>Объём 24ч</span><b id="x-vol" class="num">—</b></div>
    </div>

    <div class="xhead-actions">
      <div class="xwallet" title="Эквити в USDT">
        <span>Эквити</span><b id="x-equity">—</b>
      </div>
      <span class="xpill demo">DEMO</span>
      <button class="xpill ghost" id="x-reset" title="Сбросить демо-счёт">Сбросить</button>
    </div>
  </header>

  <!-- ========== CHART ========== -->
  <main class="xchart">
    <div class="xchart-head">
      <div class="ohlc" id="x-ohlc"></div>
      <div class="tf" id="x-tf">
        <button data-tf="1m">1m</button>
        <button data-tf="5m">5m</button>
        <button data-tf="15m" class="active">15m</button>
        <button data-tf="1h">1h</button>
        <button data-tf="4h">4h</button>
        <button data-tf="1d">1D</button>
      </div>
    </div>
    <div class="xchart-wrap">
      <canvas id="x-chart"></canvas>
      <div class="xchart-status" id="x-chart-status" hidden></div>
    </div>
  </main>

  <!-- ========== ORDER BOOK ========== -->
  <aside class="xbook">
    <div class="xbox-head">Стакан</div>
    <div class="xbook-cols">
      <span>Цена</span>
      <span>Объём (<span class="xbase">BTC</span>)</span>
      <span>Сумма</span>
    </div>
    <div class="xbook-asks" id="x-asks"></div>
    <div class="xbook-mid">
      <b id="x-mid">—</b>
      <small id="x-spread">—</small>
    </div>
    <div class="xbook-bids" id="x-bids"></div>
  </aside>

  <!-- ========== TRADES ========== -->
  <aside class="xtrades">
    <div class="xbox-head">Сделки</div>
    <div class="xtr-cols">
      <span>Цена</span>
      <span>Объём (<span class="xbase">BTC</span>)</span>
      <span>Время</span>
    </div>
    <div class="xtr-list" id="x-trades"></div>
  </aside>

  <!-- ========== MARKETS WATCHLIST ========== -->
  <aside class="xmarkets">
    <div class="xbox-head">
      <span>Рынки</span>
      <input type="search" class="xpair-search" id="x-market-search" placeholder="Поиск" autocomplete="off">
    </div>
    <div class="xm-cols"><span>Пара</span><span>Цена</span><span>24ч</span></div>
    <div class="xm-list" id="x-markets">
      <div class="xm-empty">Загрузка рынков…</div>
    </div>
  </aside>

  <!-- ========== ORDER FORM ========== -->
  <section class="xform">
    <div class="xform-tabs" id="x-form-tabs">
      <button data-type="market" class="active">Маркет</button>
      <button data-type="limit">Лимит</button>
    </div>

    <div class="xform-grid">
      <div class="xform-side buy">
        <div class="xform-row"><span>Доступно</span><b id="x-bal-usdt">0.00 USDT</b></div>
        <label class="xform-lbl" id="x-buy-price-lbl" hidden>
          <span>Цена (USDT)</span>
          <input id="x-buy-price" type="number" step="any" inputmode="decimal">
        </label>
        <label class="xform-lbl">
          <span>Сумма USDT</span>
          <input id="x-buy-amt" type="number" step="any" value="100" inputmode="decimal">
        </label>
        <div class="xform-pct" data-side="buy">
          <button type="button" data-p="0.25">25%</button>
          <button type="button" data-p="0.5">50%</button>
          <button type="button" data-p="0.75">75%</button>
          <button type="button" data-p="1">100%</button>
        </div>
        <div class="xform-info"><span>Получите</span><b id="x-buy-recv">— <span class="xbase">BTC</span></b></div>
        <button class="xform-submit buy" id="x-buy">Купить <span class="xbase">BTC</span></button>
      </div>

      <div class="xform-side sell">
        <div class="xform-row"><span>Доступно</span><b id="x-bal-base">0 <span class="xbase">BTC</span></b></div>
        <label class="xform-lbl" id="x-sell-price-lbl" hidden>
          <span>Цена (USDT)</span>
          <input id="x-sell-price" type="number" step="any" inputmode="decimal">
        </label>
        <label class="xform-lbl">
          <span>Сумма <span class="xbase">BTC</span></span>
          <input id="x-sell-amt" type="number" step="any" value="0.001" inputmode="decimal">
        </label>
        <div class="xform-pct" data-side="sell">
          <button type="button" data-p="0.25">25%</button>
          <button type="button" data-p="0.5">50%</button>
          <button type="button" data-p="0.75">75%</button>
          <button type="button" data-p="1">100%</button>
        </div>
        <div class="xform-info"><span>Получите</span><b id="x-sell-recv">— USDT</b></div>
        <button class="xform-submit sell" id="x-sell">Продать <span class="xbase">BTC</span></button>
      </div>
    </div>
  </section>

  <!-- ========== BOTTOM TABS ========== -->
  <section class="xbottom">
    <div class="xb-tabs" id="x-btabs">
      <button data-tab="open" class="active">Открытые ордера <span id="x-open-count">0</span></button>
      <button data-tab="history">История сделок</button>
      <button data-tab="balances">Балансы</button>
    </div>
    <div class="xb-table-wrap">
      <table class="xb-table">
        <thead id="x-b-head"></thead>
        <tbody id="x-b-body"></tbody>
      </table>
    </div>
  </section>
</div>

<div id="qa" data-theme="dark"></div>
<div class="xtoast" id="x-toast"></div>

<script src="/js/common.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/terminal.js"></script>
<script src="/js/shared.js"></script>
</body>
</html>
